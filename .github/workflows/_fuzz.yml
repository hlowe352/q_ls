name: _fuzz

on:
  workflow_call:
    inputs:
      max_total_time:
        description: "Seconds to fuzz for"
        type: number
        required: true
      artifact_name:
        description: "Name to give the uploaded crash artifacts on failure"
        type: string
        required: true
      timeout_minutes:
        description: "Job-level timeout in minutes (safety net above max_total_time)"
        type: number
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }} target
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        # parse: the parser alone; document: every editor feature on top.
        target: [parse, document]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: install cargo-fuzz
        # Use cargo install without --locked so rustix (a cargo-fuzz dep) can
        # be resolved to a version compatible with current nightly. The
        # rust-cache step above caches ~/.cargo/bin between runs.
        run: cargo +nightly install cargo-fuzz

      # Keep the corpus between runs so each one builds on the last.
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: fuzz ${{ matrix.target }} target
        env:
          MAX_TIME: ${{ inputs.max_total_time }}
          TARGET: ${{ matrix.target }}
        # New inputs go to the first corpus directory, so the real q fixtures
        # come second as read-only seeds; `-max_len` truncates the large ones
        # to keep executions fast. `+nightly` overrides the repo's pinned
        # stable (rust-toolchain.toml).
        run: |
          mkdir -p fuzz/corpus/$TARGET
          cargo +nightly fuzz run $TARGET fuzz/corpus/$TARGET crates/parser/tests/data/real_q -- -max_total_time=$MAX_TIME -timeout=10 -max_len=4096

      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.target }}
          path: fuzz/artifacts/
