name: _fuzz

on:
  workflow_call:
    inputs:
      max_total_time:
        description: "Seconds to fuzz for"
        type: number
        required: true
      artifact_name:
        description: "Name to give the uploaded crash artifacts on failure"
        type: string
        required: true
      timeout_minutes:
        description: "Job-level timeout in minutes (safety net above max_total_time)"
        type: number
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: parse target
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/parser/fuzz

      - name: install cargo-fuzz
        # Use cargo install without --locked so rustix (a cargo-fuzz dep) can
        # be resolved to a version compatible with current nightly. The
        # rust-cache step above caches ~/.cargo/bin between runs.
        run: cargo install cargo-fuzz

      - name: fuzz parse target
        working-directory: crates/parser
        env:
          MAX_TIME: ${{ inputs.max_total_time }}
        run: cargo fuzz run parse tests/data/real_q -- -max_total_time=$MAX_TIME -timeout=10

      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: crates/parser/fuzz/artifacts/
